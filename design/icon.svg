<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54E8A8"/>
      <stop offset="0.52" stop-color="#1FC0A0"/>
      <stop offset="1" stop-color="#087F70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EE8B06"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset="1" stop-color="#F8C63F"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDFAF4"/>
    </linearGradient>
    <filter id="shadowBook" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#04503F" flood-opacity="0.38"/>
    </filter>
    <filter id="shadowCoin" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="2" dy="20" stdDeviation="24" flood-color="#5C3600" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 账本 -->
  <g filter="url(#shadowBook)">
    <rect x="246" y="300" width="54" height="400" rx="27" fill="#FFFFFF" opacity="0.9"/>
    <rect x="312" y="238" width="420" height="520" rx="44" fill="url(#page)"/>
  </g>

  <!-- 记录线条 -->
  <g fill="#C6EFDD">
    <rect x="366" y="340" width="282" height="26" rx="13"/>
    <rect x="366" y="410" width="226" height="26" rx="13"/>
    <rect x="366" y="480" width="170" height="26" rx="13"/>
  </g>

  <!-- 金币 -->
  <g filter="url(#shadowCoin)">
    <circle cx="690" cy="700" r="148" fill="url(#gold)"/>
    <circle cx="690" cy="700" r="116" fill="url(#goldInner)" stroke="#DE8A04" stroke-width="7"/>
  </g>
  <!-- 高光弧 -->
  <path d="M 606 650 A 116 116 0 0 1 664 588" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- ¥ 符号 -->
  <g stroke="#B45309" stroke-width="17" stroke-linecap="round" fill="none">
    <path d="M 642 650 L 690 700"/>
    <path d="M 738 650 L 690 700"/>
    <path d="M 690 700 L 690 752"/>
    <path d="M 651 710 L 729 710"/>
    <path d="M 651 734 L 729 734"/>
  </g>
</svg>
