<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 250" width="260" height="250">
  <defs>
    <linearGradient id="body" x1="0.18" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFED9E"/>
      <stop offset="0.42" stop-color="#FFD64F"/>
      <stop offset="1" stop-color="#F2AC12"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFDF74"/>
      <stop offset="1" stop-color="#F0A80F"/>
    </linearGradient>
    <linearGradient id="coin" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFEEA8"/>
      <stop offset="0.55" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#D99009"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.4" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFFBE0" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFBE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="126" cy="236" rx="62" ry="9" fill="#C99A3A" opacity="0.18"/>

  <!-- 耳朵 -->
  <path d="M90 96 C74 82 76 60 92 57 C106 55 114 72 110 96 Z" fill="url(#ear)"/>
  <path d="M95 92 C84 80 87 66 95 66 C102 66 106 79 103 92 Z" fill="#FFF0BF" opacity="0.85"/>
  <path d="M162 96 C178 82 176 60 160 57 C146 55 138 72 142 96 Z" fill="url(#ear)"/>
  <path d="M157 92 C168 80 165 66 157 66 C150 66 146 79 149 92 Z" fill="#FFF0BF" opacity="0.85"/>

  <!-- 身体 -->
  <path d="M126 78 C184 78 207 114 207 152 C207 197 173 224 126 224 C79 224 45 197 45 152 C45 114 68 78 126 78 Z" fill="url(#body)"/>

  <!-- 顶部高光 -->
  <ellipse cx="96" cy="112" rx="33" ry="20" fill="url(#shine)"/>

  <!-- 投币口 -->
  <rect x="103" y="84" width="48" height="13" rx="6.5" fill="#C98A0B"/>
  <rect x="107" y="87.5" width="40" height="6" rx="3" fill="#8A5A00"/>

  <!-- 眼睛 -->
  <ellipse cx="101" cy="150" rx="8.4" ry="10.6" fill="#3A2D1C"/>
  <ellipse cx="151" cy="150" rx="8.4" ry="10.6" fill="#3A2D1C"/>
  <circle cx="103.8" cy="146.4" r="2.9" fill="#FFFFFF"/>
  <circle cx="153.8" cy="146.4" r="2.9" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <ellipse cx="80" cy="168" rx="9.6" ry="7" fill="#FF9E7A" opacity="0.55"/>
  <ellipse cx="172" cy="168" rx="9.6" ry="7" fill="#FF9E7A" opacity="0.55"/>

  <!-- 猪鼻 -->
  <ellipse cx="126" cy="180" rx="21" ry="14" fill="#FFF4C8"/>
  <ellipse cx="119" cy="180" rx="2.8" ry="3.8" fill="#D89A0C"/>
  <ellipse cx="133" cy="180" rx="2.8" ry="3.8" fill="#D89A0C"/>

  <!-- 脚（贴住身体底缘，避免像独立色块） -->
  <ellipse cx="100" cy="219" rx="17" ry="10" fill="#F0AC16" opacity="0.55"/>
  <ellipse cx="152" cy="219" rx="17" ry="10" fill="#F0AC16" opacity="0.55"/>

  <!-- 金币 -->
  <circle cx="190" cy="199" r="25" fill="url(#coin)"/>
  <circle cx="190" cy="199" r="19" fill="none" stroke="#FFF3C2" stroke-width="2.6" opacity="0.9"/>
  <path d="M182.5 186 L190 196 M197.5 186 L190 196 M190 196 L190 211 M183 200 H197 M183 205.5 H197"
        fill="none" stroke="#B0740A" stroke-width="3.3" stroke-linecap="round"/>

  <!-- 小手臂扶着金币 -->
  <ellipse cx="161" cy="195" rx="13" ry="10" fill="#F7BC2A" transform="rotate(-20 161 195)"/>
  <ellipse cx="163" cy="194" rx="7" ry="5" fill="#FFE072" opacity="0.75" transform="rotate(-20 163 194)"/>
</svg>
