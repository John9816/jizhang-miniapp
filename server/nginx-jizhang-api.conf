# 记账本小程序后端反代：jizhang-api.751152.xyz → 127.0.0.1:3123（systemd 服务 jizhang-api）
# 安装位置：/etc/nginx/conf.d/jizhang-api.conf
# 说明：TLS 由 nginx 用 certbot 证书终止（certbot --nginx -d jizhang-api.751152.xyz 会自动追加 443 段）

server {
    listen 80;
    listen [::]:80;
    server_name jizhang-api.751152.xyz;

    # Let's Encrypt 续期验证走这里
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 记账 API：只收 JSON，1m 足够（与后端请求体上限一致）
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3123;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/jizhang-api.access.log;
    error_log  /var/log/nginx/jizhang-api.error.log;
}
